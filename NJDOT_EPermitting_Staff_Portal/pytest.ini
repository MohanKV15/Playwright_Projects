[pytest]

# ------------------------------------------------------------------
# Native Playwright artifact configuration
# Automatically captures screenshots, videos, and traces on failures
# ------------------------------------------------------------------

addopts =
    --browser chromium
    --junitxml=reports/junit.xml
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/native_artifacts
    --html=reports/test_report.html
    --self-contained-html
    --alluredir=reports/allure-results

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning

markers =
    smoke: mark test as smoke test
    regression: mark test as regression test
    serial: run sequentially
    authenticated: mark test as requiring an authenticated dashboard/session
    applicant_information: Applicant and Permittee tab workflows
    permit_listing: Permit search and listing workflows
    general_information: General information tab workflows
    inspection: Inspection and MT121 inspection tests
    document: Document attachment and package generation tests
    customer_communication: Customer communication and log tests
    checklist: Checklist and completeness check tests
    lot_development: Lot development workflows
    account_management: Account and user management workflows
