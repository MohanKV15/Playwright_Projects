[pytest]
addopts = -v -s --junitxml=reports/junit.xml --html=reports/test_report.html --self-contained-html --alluredir=reports/allure-results
testpaths = tests
norecursedirs = venv .venv .auth .git
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    smoke: Smoke test suite for critical application workflows
    regression: Full regression test suite
    login: Login and authentication test cases
    dashboard: Staff dashboard navigation and metrics test cases
    adtrak: ADTrak module and permit search tests
    authenticated: Tests requiring an authenticated user session
    add_paper_application: Paper application creation workflows
    gis: GIS navigation and map display test cases
    application_permit: Application and permit search and details test cases
    inspection: Inspection workflow and log tests
    customer_action_items: Customer action items workflow tests
    review: Review and reviewer assignment tests
    amendment: Amendment workflow and modification request tests
    permit_completion: Permit completion and permit generation tests
    original_permit: Original permit view and verification tests
    payment_listing: Payment listing and add payment workflow tests
    generate_forms: Generate forms and documents/letters workflow tests
    status_log: Status log and add status workflow tests
    documents_and_log: Documents and communication log workflow tests
    junkyards: Junkyard module tests
    junkyard_add_new_applications: Junkyard add paper application workflow tests
    junkyard_details: Junkyard details search and edit workflow tests
    junkyard_inspection: Junkyard inspection workflow tests
    junkyard_customer_action_items: Junkyard customer action items workflow tests
    junkyard_review: Junkyard review workflow tests
    junkyard_permit_completion: Junkyard permit completion workflow tests
    serial: Tests that must be executed serially





