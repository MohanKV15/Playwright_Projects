[pytest]
addopts = -v -s --junitxml=reports/junit.xml --html=reports/test_report.html --self-contained-html --alluredir=reports/allure-results
testpaths = tests
norecursedirs = venv .venv .auth .git
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    smoke: Smoke test suite for critical application workflows
    regression: Full regression test suite
    login: Login and authentication test cases
    dashboard: Staff dashboard navigation and metrics test cases
    adtrak: ADTrak module and permit search tests
    authenticated: Tests requiring an authenticated user session
    add_paper_application: Paper application creation workflows
    serial: Tests that must be executed serially
