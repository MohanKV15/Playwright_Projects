[pytest]

# ------------------------------------------------------------------
# Native Playwright artifact configuration
# Automatically captures screenshots, videos, and traces on failures
# ------------------------------------------------------------------

addopts =
    --browser chromium
    --junitxml=reports/junit.xml
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/native_artifacts
    --html=reports/test_report.html
    --self-contained-html
    --alluredir=reports/allure-results

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning

markers =
    smoke: mark test as smoke test
    regression: mark test as regression test
    serial: run sequentially
    authenticated: mark test as requiring an authenticated dashboard/session
    login: Login and authentication workflows
    action_items: Customer action items workflows
    permit_application: Permit application workflows
    license_application: Outdoor advertising license applications
    applications_history: Application history tracking
    payment: Payment activity workflows
    permit_transfer: Permit transfer workflows
