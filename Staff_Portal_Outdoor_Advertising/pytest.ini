[pytest]

# ------------------------------------------------------------------
# Native Playwright artifact configuration
# Automatically captures screenshots, videos, and traces on failures
# ------------------------------------------------------------------

addopts =
    --browser chromium
    --junitxml=reports/junit.xml
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/native_artifacts
    --html=reports/test_report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --import-mode=importlib

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: mark test as smoke test
    regression: mark test as regression test
    serial: run sequentially
    authenticated: mark test as requiring an authenticated dashboard/session
