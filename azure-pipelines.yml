# ==============================================================================
# Azure DevOps CI/CD Pipeline - Playwright Python Automation Test Suite
# Enterprise Senior QA Grade Pipeline Configuration
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - master
  paths:
    exclude:
      - '**.md'
      - '**.pdf'

pr:
  branches:
    include:
      - main
      - master

schedules:
  - cron: "0 2 * * 1-5"
    displayName: "Mon-Fri Nightly Regression Run"
    branches:
      include:
        - main
    always: true

parameters:
  - name: projectToRun
    displayName: "Select Target Project Suite"
    type: string
    default: "All"
    values:
      - "All"
      - "NJDOT_EPermitting_Customer_Portal"
      - "NJDOT_EPermitting_Staff_Portal"
      - "NJDOT_ODA_Customer_Portal"
      - "NJDOT_ODA_Staff_Portal"

  - name: testType
    displayName: "Select Test Execution Mode"
    type: string
    default: "Regression"
    values:
      - "Regression"
      - "Smoke"

  - name: parallelWorkers
    displayName: "xdist Parallel Workers (-n)"
    type: string
    default: "4"

variables:
  - group: PlaywrightSecrets # Azure DevOps Variable Group (contains NJHT_EMAIL, NJHT_PASSWORD, STAFF_EMAIL, STAFF_PASSWORD, STAFF_PIN)
  - name: CI
    value: "true"
  - name: PW_HEADLESS
    value: "true"
  - name: PIP_CACHE_DIR
    value: $(Pipeline.Workspace)/.pip_cache
  - name: PLAYWRIGHT_BROWSERS_PATH
    value: $(Pipeline.Workspace)/.ms-playwright

stages:
  - stage: TestExecution
    displayName: "Execute Playwright Automated Tests"
    jobs:
      - job: RunPlaywrightTests
        displayName: "Run Playwright Test Suite"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - task: UsePythonVersion@0
            displayName: "Set up Python 3.11"
            inputs:
              versionSpec: "3.11"
              addToPath: true

          # --------------------------------------------------------------------
          # Enterprise Cache 1: Python Pip Dependencies Cache
          # --------------------------------------------------------------------
          - task: Cache@2
            displayName: "Cache Python Pip Packages"
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)

          # --------------------------------------------------------------------
          # Enterprise Cache 2: Playwright Chromium Browser Binaries Cache
          # --------------------------------------------------------------------
          - task: Cache@2
            displayName: "Cache Playwright Browser Binaries"
            inputs:
              key: 'playwright | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                playwright | "$(Agent.OS)"
              path: $(PLAYWRIGHT_BROWSERS_PATH)

          - script: |
              python -m pip install --upgrade pip setuptools wheel
              pip install --cache-dir $(PIP_CACHE_DIR) -r requirements.txt
            displayName: "Install Python Dependencies"

          - script: |
              npx playwright install --with-deps chromium
            displayName: "Install Playwright Chromium Browser & OS Dependencies"

          - script: |
              mkdir -p NJDOT_EPermitting_Customer_Portal/reports
              mkdir -p NJDOT_EPermitting_Staff_Portal/reports
              mkdir -p NJDOT_ODA_Customer_Portal/reports
              mkdir -p NJDOT_ODA_Staff_Portal/reports
            displayName: "Create Report Directories"

          - script: |
              echo "=== DETECTING CHANGED SUB-PROJECTS ==="
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
              echo "Changed files in commit:"
              echo "$CHANGED_FILES"

              # Check if global files or all projects modified
              if echo "$CHANGED_FILES" | grep -q "ALL" || echo "$CHANGED_FILES" | grep -vE "^(NJDOT_EPermitting_Customer_Portal|NJDOT_EPermitting_Staff_Portal|NJDOT_ODA_Customer_Portal|NJDOT_ODA_Staff_Portal)/"; then
                echo "Global files modified or full run required. Enabling all projects."
                echo "##vso[task.setvariable variable=RUN_ALL]true"
              else
                echo "##vso[task.setvariable variable=RUN_ALL]false"
              fi

              if echo "$CHANGED_FILES" | grep -q "^NJDOT_EPermitting_Customer_Portal/"; then
                echo "##vso[task.setvariable variable=RUN_NJDOT_EPERMITTING]true"
              fi
              if echo "$CHANGED_FILES" | grep -q "^NJDOT_EPermitting_Staff_Portal/"; then
                echo "##vso[task.setvariable variable=RUN_STAFF_EPERMITTING]true"
              fi
              if echo "$CHANGED_FILES" | grep -q "^NJDOT_ODA_Customer_Portal/"; then
                echo "##vso[task.setvariable variable=RUN_NJDOT_OUTDOOR]true"
              fi
              if echo "$CHANGED_FILES" | grep -q "^NJDOT_ODA_Staff_Portal/"; then
                echo "##vso[task.setvariable variable=RUN_STAFF_OUTDOOR]true"
              fi
            displayName: "Detect Changed Sub-Projects for Selective Execution"

          # --------------------------------------------------------------------
          # Project 1: NJDOT EPermitting Customer Portal
          # --------------------------------------------------------------------
          - script: |
              echo "Executing NJDOT_EPermitting_Customer_Portal..."
              cd NJDOT_EPermitting_Customer_Portal
              if [ "${{ parameters.testType }}" = "Smoke" ]; then
                python -m pytest -m "smoke" -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              else
                python -m pytest -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              fi
            displayName: "Run NJDOT EPermitting Customer Portal Tests"
            condition: or(eq('${{ parameters.projectToRun }}', 'NJDOT_EPermitting_Customer_Portal'), and(eq('${{ parameters.projectToRun }}', 'All'), or(eq(variables['RUN_ALL'], 'true'), eq(variables['RUN_NJDOT_EPERMITTING'], 'true'))))
            env:
              NJHT_EMAIL: $(NJHT_EMAIL)
              NJHT_PASSWORD: $(NJHT_PASSWORD)
              CI: "true"
              PW_HEADLESS: "true"

          # --------------------------------------------------------------------
          # Project 2: NJDOT EPermitting Staff Portal
          # --------------------------------------------------------------------
          - script: |
              echo "Executing NJDOT_EPermitting_Staff_Portal..."
              cd NJDOT_EPermitting_Staff_Portal
              if [ "${{ parameters.testType }}" = "Smoke" ]; then
                python -m pytest -m "smoke" -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              else
                python -m pytest -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              fi
            displayName: "Run NJDOT EPermitting Staff Portal Tests"
            condition: or(eq('${{ parameters.projectToRun }}', 'NJDOT_EPermitting_Staff_Portal'), and(eq('${{ parameters.projectToRun }}', 'All'), or(eq(variables['RUN_ALL'], 'true'), eq(variables['RUN_STAFF_EPERMITTING'], 'true'))))
            env:
              STAFF_EMAIL: $(STAFF_EMAIL)
              STAFF_PASSWORD: $(STAFF_PASSWORD)
              STAFF_PIN: $(STAFF_PIN)
              CI: "true"
              PW_HEADLESS: "true"

          # --------------------------------------------------------------------
          # Project 3: NJDOT ODA Customer Portal
          # --------------------------------------------------------------------
          - script: |
              echo "Executing NJDOT_ODA_Customer_Portal..."
              cd NJDOT_ODA_Customer_Portal
              if [ "${{ parameters.testType }}" = "Smoke" ]; then
                python -m pytest -m "smoke" -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              else
                python -m pytest -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              fi
            displayName: "Run NJDOT ODA Customer Portal Tests"
            condition: or(eq('${{ parameters.projectToRun }}', 'NJDOT_ODA_Customer_Portal'), and(eq('${{ parameters.projectToRun }}', 'All'), or(eq(variables['RUN_ALL'], 'true'), eq(variables['RUN_NJDOT_OUTDOOR'], 'true'))))
            env:
              NJHT_EMAIL: $(NJHT_EMAIL)
              NJHT_PASSWORD: $(NJHT_PASSWORD)
              CI: "true"
              PW_HEADLESS: "true"

          # --------------------------------------------------------------------
          # Project 4: NJDOT ODA Staff Portal
          # --------------------------------------------------------------------
          - script: |
              echo "Executing NJDOT_ODA_Staff_Portal..."
              cd NJDOT_ODA_Staff_Portal
              if [ "${{ parameters.testType }}" = "Smoke" ]; then
                python -m pytest -m "smoke" -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              else
                python -m pytest -n ${{ parameters.parallelWorkers }} --reruns 1 -v
              fi
            displayName: "Run NJDOT ODA Staff Portal Tests"
            condition: or(eq('${{ parameters.projectToRun }}', 'NJDOT_ODA_Staff_Portal'), and(eq('${{ parameters.projectToRun }}', 'All'), or(eq(variables['RUN_ALL'], 'true'), eq(variables['RUN_STAFF_OUTDOOR'], 'true'))))
            env:
              STAFF_EMAIL: $(STAFF_EMAIL)
              STAFF_PASSWORD: $(STAFF_PASSWORD)
              STAFF_PIN: $(STAFF_PIN)
              CI: "true"
              PW_HEADLESS: "true"


          # --------------------------------------------------------------------
          # Publish Test Results to Azure DevOps Pipeline UI
          # --------------------------------------------------------------------
          - task: PublishTestResults@2
            displayName: "Publish JUnit Test Results to Azure DevOps"
            condition: always()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/reports/junit.xml"
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: "Playwright Automated Test Execution"

          # --------------------------------------------------------------------
          # Publish HTML & Artifact Reports (Screenshots, Traces, HTML)
          # --------------------------------------------------------------------
          - task: PublishBuildArtifacts@1
            displayName: "Publish Test Artifacts (HTML Reports, Screenshots, Traces)"
            condition: always()
            inputs:
              PathtoPublish: "$(Build.SourcesDirectory)"
              ArtifactName: "PlaywrightTestReports"
              publishLocation: "Container"
